[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentd"
version = "0.1.0"
description = "Alertmanager webhook to managed incident lifecycle with dedupe, severity policy, MTTD/MTTR and blameless postmortem generation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jeferson Melo" }]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "jsonschema>=4.20",
    "pip-audit>=2.7",
]

[project.scripts]
incidentd = "incidentd.cli:main"

[tool.setuptools]
packages = ["incidentd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:incidentd.*"]

[tool.coverage.run]
source = ["incidentd"]
branch = true
omit = ["incidentd/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".venv", "var", "reports", "htmlcov"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4"]
ignore = ["B008"]  # FastAPI's Depends/Body/Query in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
